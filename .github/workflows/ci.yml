name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: Documentation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doc-check compares journal and code commit dates
      - run: scripts/doc-check.sh

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
        working-directory: app
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - name: Domain purity
        run: make domain-purity

  test:
    name: Test and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
        working-directory: app
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: app
      - name: Domain engine coverage gate
        run: make coverage-gate

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8       # CocoaPods fails without a UTF-8 locale
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
        working-directory: app
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: app
      - run: flutter build ios --simulator --debug
        working-directory: app

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
        working-directory: app
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: app
      - run: flutter build apk --debug --split-per-abi
        working-directory: app
