# The server, and nothing else.
#
#   docker compose up --build
#   open http://localhost:8080/healthz
#
# Statements live in memory by default, so this comes up with no database to
# provision and nothing to migrate. That is the right default for something
# whose purpose is to be clicked on: a portfolio reviewer who has to stand up
# Postgres before they can see the page will not see the page.
#
# The trade is that a restart loses issued links. Postgres goes behind the same
# `store.Store` interface when that matters — the port exists precisely so the
# swap is a constructor change and no handler moves.
services:
  server:
    build:
      context: .
      target: server
    ports:
      - "8080:8080"
    environment:
      GRID_ADDR: ":8080"
      # landlord:key pairs. Change this before it is anywhere but a laptop —
      # it is the only thing standing between a stranger and the ability to
      # issue statements in somebody else's name.
      GRID_API_KEYS: "demo-landlord:change-me"
    healthcheck:
      test: ["CMD", "/gridserver", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
